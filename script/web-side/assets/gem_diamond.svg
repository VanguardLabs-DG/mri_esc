<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5b8" />
      <stop offset="50%" stop-color="#ffd566" />
      <stop offset="100%" stop-color="#df9d24" />
    </linearGradient>

    <linearGradient id="goldCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#543700" />
      <stop offset="60%" stop-color="#805609" />
      <stop offset="100%" stop-color="#df9d24" />
    </linearGradient>

    <linearGradient id="goldFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa0" />
      <stop offset="100%" stop-color="#c68516" />
    </linearGradient>

    <linearGradient id="goldFacetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd566" />
      <stop offset="100%" stop-color="#8f5b02" />
    </linearGradient>

    <linearGradient id="goldBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5ba38" />
      <stop offset="100%" stop-color="#8a5600" />
    </linearGradient>

    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbe0" />
      <stop offset="50%" stop-color="#ffd566" />
      <stop offset="100%" stop-color="#9a6206" />
    </linearGradient>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Base Diamond Outline -->
    <!-- Points: Top-Left (17, 16), Top-Right (47, 16), Far-Right (58, 28), Bottom (32, 54), Far-Left (6, 28) -->
    <polygon points="17,16 47,16 58,28 32,54 6,28" 
             fill="url(#goldBottom)" 
             stroke="url(#strokeGrad)" 
             stroke-width="2.5" 
             stroke-linejoin="round" />

    <!-- Top Left Upper Facet -->
    <polygon points="17,16 6,28 22,28" 
             fill="url(#goldFacetLeft)" 
             stroke="url(#strokeGrad)" 
             stroke-width="1.2" 
             stroke-linejoin="round" />

    <!-- Top Right Upper Facet -->
    <polygon points="47,16 58,28 42,28" 
             fill="url(#goldFacetRight)" 
             stroke="url(#strokeGrad)" 
             stroke-width="1.2" 
             stroke-linejoin="round" />

    <!-- Top Center Upper Facet -->
    <polygon points="17,16 47,16 42,28 22,28" 
             fill="url(#goldTop)" 
             stroke="url(#strokeGrad)" 
             stroke-width="1.2" 
             stroke-linejoin="round" />

    <!-- Lower Left Facet -->
    <polygon points="6,28 22,28 32,54" 
             fill="url(#goldFacetLeft)" 
             stroke="url(#strokeGrad)" 
             stroke-width="1.2" 
             stroke-linejoin="round" />

    <!-- Lower Right Facet -->
    <polygon points="58,28 42,28 32,54" 
             fill="url(#goldFacetRight)" 
             stroke="url(#strokeGrad)" 
             stroke-width="1.2" 
             stroke-linejoin="round" />

    <!-- Center Lower Facet (Table / Core) -->
    <polygon points="22,28 42,28 32,54" 
             fill="url(#goldCenter)" 
             stroke="url(#strokeGrad)" 
             stroke-width="1.2" 
             stroke-linejoin="round" />

    <!-- Center Inner Arc Highlight -->
    <path d="M 24,31 Q 32,26 40,31 Q 32,46 32,46 Z" 
          fill="url(#goldTop)" 
          opacity="0.9" />

    <!-- Brilliant Top Reflection Line -->
    <line x1="20" y1="18" x2="44" y2="18" 
          stroke="#ffffff" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          opacity="0.85" />

    <!-- Star Glint on Top Right Shoulder -->
    <circle cx="47" cy="16" r="1.5" fill="#ffffff" />
  </g>
</svg>
